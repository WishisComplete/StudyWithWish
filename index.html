  tokyo_slang:'若者語'
};
const DIALECT_REGION_COLOR={

function buildDialectCard(s){
  const entries=SENT_DIALECT[s.id];
  if(!entries||!entries.length) return '';
  const items=entries.map(d=>`
    <div class="dialect-entry">
      <div class="dialect-entry-head">
        <span class="dialect-badge" style="background:${DIALECT_REGION_COLOR[d.region]||'#888'}">${DIALECT_REGION_LABEL[d.region]||d.badge}</span>
      </div>
      <div class="dialect-entry-dial">${d.dial}</div>
      <div class="dialect-entry-read">${d.read}</div>
      <div class="dialect-entry-note">${d.note}</div>
    </div>`).join('');
  return `
    <div class="dialect-card" id="dialect-card">
      <button class="dialect-toggle" onclick="toggleDialect()">
        <span style="font-size:16px;flex-shrink:0">🗣️</span>
        <span style="flex:1;font-size:14px;font-weight:500;color:var(--ink)">방언으로 말하면?</span>
        <span class="material-symbols-rounded dialect-chevron">expand_more</span>
      </button>
      <div class="dialect-body">
        <div class="dialect-inner">${items}</div>
      </div>
    </div>`;
}

function toggleDialect(){
  document.getElementById('dialect-card')?.classList.toggle('open');
}

  else{

function onYouTubeIframeAPIReady(){
  detailP=new YT.Player('detailPlayer',{height:'100%',width:'100%',videoId:PL[selVI].videoId,playerVars:{origin:location.origin,controls:1,rel:0,autoplay:0},events:{onStateChange:onDetailStateChange}});
}

function onDetailStateChange(e){
  if(e.data===YT.PlayerState.PLAYING)startActiveSentTracking();
  else stopActiveSentTracking();
}

function startActiveSentTracking(){
  stopActiveSentTracking();
  activeSentTick=setInterval(()=>{
    if(!detailP?.getCurrentTime)return;
    const cur=detailP.getCurrentTime();
    const sents=PL[selVI].sentences;
    let found=null;
    for(const s of sents){if(cur>=s.start&&cur<s.end){found=s;break;}}
    if(!found){
      if(detailLoop)return;
      const next=sents.find(s=>toSec(s.start)>cur);
      if(next){detailP.seekTo(toSec(next.start),true);return;}
      else{detailP.pauseVideo();stopActiveSentTracking();return;}
    }
    const newId=found?found.id:null;
    if(newId!==lastActiveId){
      if(lastActiveId)document.getElementById('row-'+lastActiveId)?.classList.remove('active');
      lastActiveId=newId;
      if(newId){document.getElementById('row-'+newId)?.classList.add('active');scrollToRowInBox(newId,false);}
    }
  },200);
}

function stopActiveSentTracking(){
  clearInterval(activeSentTick);activeSentTick=null;
  if(lastActiveId){document.getElementById('row-'+lastActiveId)?.classList.remove('active');lastActiveId=null;}
}

let activeCwEl=null;
let activeRtEl=null;
let activeOrigRt='';

function closeTooltip(resumeVideo){
  if(activeCwEl){
    activeCwEl.classList.remove('word-active');
    activeCwEl=null;
  }
  if(activeRtEl){
    activeRtEl.textContent=activeOrigRt;
    activeRtEl=null;
  }
  activeOrigRt='';
  if(resumeVideo && wasPlayingBeforeWord){
    const isDetail=document.getElementById('view-detail').style.display==='flex';
    if(isDetail && detailP && typeof detailP.playVideo==='function') detailP.playVideo();
    wasPlayingBeforeWord=false;
  }
}

function showWord(e, wkey){
  e.stopPropagation();
  const d=WDB[wkey];
  if(!d) return;
  const cwEl=e.currentTarget;

  if(activeCwEl===cwEl){ closeTooltip(true); return; }
  closeTooltip(false);

  const isDetail=document.getElementById('view-detail').style.display==='flex';
  if(isDetail && detailP){
    const state=detailP.getPlayerState?.();
    wasPlayingBeforeWord=(state===1);
    if(wasPlayingBeforeWord) detailP.pauseVideo();
  } else { wasPlayingBeforeWord=false; }

  activeCwEl=cwEl;
  cwEl.classList.add('word-active');

  // rt는 항상 존재 (addCwHandlers에서 보장)
  const rt=cwEl.querySelector('rt');
  if(rt){
    activeRtEl=rt;
    activeOrigRt=rt.textContent;
    const mean=d.m||'';
    // 뜻 앞부분만 — 길면 잘라서
    const short=mean.split(/[·\/\(（]/)[0].trim().slice(0,9);
    rt.textContent=short;
  }
}

// data-w 속성 기반으로 onclick 추가 (innerHTML 삽입 후 이벤트 위임)
function addCwHandlers(html){
  // data-w 속성을 onclick으로 변환하면서
  // .cw 안의 내용 전체를 <ruby>…<rt>요미가나</rt></ruby>로 감싸
  // 그래야 rt가 한자뿐 아니라 단어 전체 위에 가운데 정렬됨
  return html.replace(/<span class="cw" data-w="([^"]+)">([\s\S]*?)<\/span>/g,
    (_, w, inner)=>{
      // inner 안에 이미 <ruby>X<rt>Y</rt></ruby> 있으면 rt만 뽑아 outer ruby로 올림
      const rtMatch=inner.match(/<rt[^>]*>([\s\S]*?)<\/rt>/);
      const rt=rtMatch?rtMatch[1]:'';
      // ruby 태그 모두 벗기고 텍스트/한자만 남김
      const bare=inner.replace(/<ruby>|<\/ruby>|<rt[^>]*>[\s\S]*?<\/rt>/g,'');
      const onclick=`showWord(event,'${w.replace(/'/g,"\\'")}')`;
      if(rt){
        return `<span class="cw" data-w="${w}" onclick="${onclick}"><ruby>${bare}<rt>${rt}</rt></ruby></span>`;
      } else {
        // 요미가나 없는 단어 (히라가나, 카타카나 등)
        return `<span class="cw" data-w="${w}" onclick="${onclick}"><ruby>${bare}<rt></rt></ruby></span>`;
      }
    });
}



function renderCultCard(s){
  const wrap=document.getElementById('cult-wrap');
  wrap.innerHTML='';

  // 0. 억양 시각화 카드 (항상 먼저)
  wrap.innerHTML+=buildIntonationCard(s);

  // 1. 문화 카드 (있는 경우만) / 없으면 팁 카드
  const cultKey=SENT_CULT[s.id];
  if(cultKey&&CULT[cultKey]){
    const c=CULT[cultKey];
    const points=c.points.map(p=>`
      <div class="cult-point"><span class="cult-dot"></span><span>${p}</span></div>`).join('');
    wrap.innerHTML+=`
      <div class="cult-card" id="cult-card">
        <button class="cult-toggle" onclick="toggleCult()">
          <span class="cult-icon">${c.icon}</span>
          <span class="cult-title">${c.title}</span>
          <span class="material-symbols-rounded cult-chevron">expand_more</span>
        </button>
        <div class="cult-body"><div class="cult-inner">${points}</div></div>
      </div>`;
  } else {
    // 팁/트렌드 카드
    const tip=SENT_TIPS[s.id];
    if(tip){
      const typeLabel={grammar:'📖 문법 팁',caution:'⚠️ 사용 주의',trend:'🔥 트렌드',tip:'💡 학습 팁'}[tip.type]||'💡 팁';
      const points=tip.points.map(p=>`
        <div class="cult-point"><span class="cult-dot"></span><span>${p}</span></div>`).join('');
      wrap.innerHTML+=`
        <div class="cult-card" id="cult-card">
          <button class="cult-toggle" onclick="toggleCult()">
            <span class="cult-icon">${tip.icon}</span>
            <span class="cult-title">${typeLabel} · ${tip.title}</span>
            <span class="material-symbols-rounded cult-chevron">expand_more</span>
          </button>
          <div class="cult-body"><div class="cult-inner">${points}</div></div>
        </div>`;
    }
  }

  // 2. 유사 패턴 예문 — alt와 중복 제거
  const pd=SENT_PATTERN[s.id];
  const ad=SENT_ALT[s.id];

  // alt에 있는 jp 텍스트 집합
  const altJpSet=new Set();
  if(ad){
    (ad.similar||[]).forEach(a=>altJpSet.add(a.jp));
    (ad.opposite||[]).forEach(a=>altJpSet.add(a.jp));
  }

  if(pd&&pd.patterns&&pd.patterns.length){
    const filtered=pd.patterns.filter(p=>!altJpSet.has(p.jp));
    if(filtered.length){
      const items=filtered.map((p,i)=>`
        <div class="pitem" id="pitem-${i}">
          <button class="pitem-toggle" onclick="togglePitem(${i})">
            <span class="pitem-jp">${p.jp}</span>
            <span class="material-symbols-rounded pitem-arr">chevron_right</span>
          </button>
          <div class="pitem-detail">
            <div class="pitem-detail-inner">
              <span class="pitem-sound">${p.sound}</span>
              <span class="pitem-trans">${p.trans}</span>
            </div>
          </div>
        </div>`).join('');
      wrap.innerHTML+=`
        <div class="pattern-card" id="pattern-card">
          <button class="pattern-toggle" onclick="togglePattern()">
            <span class="pattern-toggle-icon">💬</span>
            <span class="pattern-toggle-title">유사 패턴 예문</span>
            <span class="material-symbols-rounded pattern-chevron">expand_more</span>
          </button>
          <div class="pattern-body"><div class="pattern-inner">${items}</div></div>
        </div>`;
    }
  }

  // 3. 비슷한/반대 표현 — 패턴과 중복 제거
  const patternJpSet=new Set();
  if(pd&&pd.patterns) pd.patterns.forEach(p=>patternJpSet.add(p.jp));

  if(ad&&(ad.similar||ad.opposite)){
    let inner='';
    const simFiltered=(ad.similar||[]).filter(a=>!patternJpSet.has(a.jp));
    const oppFiltered=(ad.opposite||[]).filter(a=>!patternJpSet.has(a.jp));
    if(simFiltered.length){
      inner+=`<div class="alt-section-label">🔗 비슷한 표현</div>`;
      inner+=simFiltered.map(a=>`
        <div class="alt-item">
          <div class="alt-item-label">${a.label}</div>
          <div class="alt-item-jp">${a.jp}</div>
          <div class="alt-item-sound">${a.sound}</div>
          <div class="alt-item-trans">${a.trans}</div>
        </div>`).join('');
    }
    if(oppFiltered.length){
      inner+=`<div class="alt-section-label">↔️ 반대 표현</div>`;
      inner+=oppFiltered.map(a=>`
        <div class="alt-item">
          <div class="alt-item-label">${a.label}</div>
          <div class="alt-item-jp">${a.jp}</div>
          <div class="alt-item-sound">${a.sound}</div>
          <div class="alt-item-trans">${a.trans}</div>
        </div>`).join('');
    }
    if(inner){
      wrap.innerHTML+=`
        <div class="alt-card" id="alt-card">
          <button class="alt-toggle" onclick="toggleAlt()">
            <span style="font-size:16px;flex-shrink:0">↔️</span>
            <span style="flex:1;font-size:14px;font-weight:500;color:var(--ink)">비슷한 · 반대 표현</span>
            <span class="material-symbols-rounded alt-chevron">expand_more</span>
          </button>
          <div class="alt-body"><div class="alt-inner">${inner}</div></div>
        </div>`;
    }
  }

  // 4. 방언 카드
  const dialectHtml=buildDialectCard(s);
  if(dialectHtml) wrap.innerHTML+=dialectHtml;
}

// ── 억양 시각화 카드 ──
function buildIntonationCard(s){
  const words=tokenizePlain(s.plain);
  if(!words||words.length===0) return '';
  const pitchData=guessPitch(words, s.sound, s.plain);
  const liaisons=detectLiaison(words);
  const svgStr=buildPitchSVG(words, pitchData, liaisons);
  return `
    <div class="intonation-card" id="intonation-card">
      <button class="intonation-toggle" onclick="toggleIntonation()">
        <span style="font-size:16px;flex-shrink:0">〜</span>
        <span style="flex:1;font-size:14px;font-weight:500;color:var(--ink)">억양 시각화</span>
        <span class="material-symbols-rounded intonation-chevron">expand_more</span>
      </button>
      <div class="intonation-body">
        <div class="intonation-inner">
          <div class="intonation-svg-wrap">${svgStr}</div>
          <div class="intonation-legend">
            <span class="int-leg"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5aaad4;vertical-align:middle;margin-right:3px"></span>음의 높낮이</span>
            ${liaisons.some(l=>l)?'<span class="int-leg"><span style="color:#d870a8;font-size:13px;margin-right:2px">⌢</span>연음</span>':''}
          </div>
          <div class="intonation-label">※ 일본어 표준 악센트 규칙 기반 추정값입니다.</div>
        </div>
      </div>
    </div>`;
}

function toggleIntonation(){
  document.getElementById('intonation-card')?.classList.toggle('open');
}

function tokenizePlain(plain){
  const cleaned=plain.replace(/[？！。、「」『』【】〔〕…]/g,' ').trim();
  const tokens=[];
  let cur='';
  for(let i=0;i<cleaned.length;i++){
    const ch=cleaned[i];
    if(ch===' '){if(cur){tokens.push(cur);cur='';}}
    else{cur+=ch;}
  }
  if(cur) tokens.push(cur);
  const result=[];
  for(const t of tokens){
    if(t.length<=5){result.push(t);}
    else{for(let i=0;i<t.length;i+=4) result.push(t.slice(i,i+4));}
  }
  return result.filter(x=>x.length>0).slice(0,12);
}

// 연음(liaison) 발생 위치 감지
function detectLiaison(words){
  // 연음: て→で接続、助詞連接、音声変化が起こりやすいペア
  const liaisonPairs=[
    [/って$/,/$/],[/て$/,/[いくる]/],[/で$/,/[きくる]/],
    [/[のがをはもに]$/,/.+/],[/たら$/,/.+/],[/[ん]$/,/[だな]/]
  ];
  return words.map((_,i)=>{
    if(i===words.length-1) return false;
    const cur=words[i], next=words[i+1];
    // てform + 補助動詞
    if(/[てで]$/.test(cur)&&/^[いくあ]/.test(next)) return true;
    // 助詞連接
    if(/[のがをはもに]$/.test(cur)) return true;
    // 促音化・撥音化連接
    if(/[んっ]$/.test(cur)&&/^[だなに]/.test(next)) return true;
    return false;
  });
}

function guessPitch(words, sound, plain){
  const n=words.length;
  const pitches=[];
  const isQuestion=/[？?]/.test(plain)||sound.endsWith('?');
  const isExclaim=/[！!]/.test(plain);
  const isFormal=/ます|です|ください|ございます/.test(plain);
  const isCasual=/じゃん|でしょ|よね|なぁ|っす|おっす/.test(plain);

  // 각 단어별 기본 피치 산출
  for(let i=0;i<n;i++){
    const w=words[i];
    const ratio=i/(n>1?n-1:1);
    let pitch;

    // 일본어 표준 악센트: 첫 모라 저 → 두번째 이후 고 → 조사에서 하강
    if(i===0){
      // 1음절 단어는 높게, 2음절+ 첫 단어는 낮게 시작
      pitch=w.length===1?0.75:0.22;
    } else if(i===1){
      pitch=0.88;
    } else {
      // 중간: 약한 하강 트렌드
      pitch=0.82-ratio*0.38;
    }

    // 단어별 특성 보정
    if(/^[なのかよねわ]$/.test(w)) pitch=Math.max(0.12,pitch-0.18); // 終助詞
    if(/^[は|が|を|に|で|と|も]$/.test(w)) pitch=Math.max(0.15,pitch-0.12); // 助詞
    if(/^(マジ|やばい|すごい|えー|えっ|あー|おー)/.test(w)) pitch=Math.min(0.95,pitch+0.15);
    if(/^(ない|なぁ|ね|よ)$/.test(w)) pitch=Math.max(0.12,pitch-0.15);
    if(isFormal&&i===n-1) pitch=0.35; // 丁寧語終止は低め
    if(isQuestion&&i===n-1) pitch=Math.min(0.9,pitch+0.3); // 疑問上昇
    if(isExclaim&&i===n-1) pitch=Math.min(0.95,pitch+0.15);
    if(isCasual) pitch=Math.min(0.92,pitch+0.05); // カジュアルは全体的に動き大きい

    pitches.push(Math.max(0.10,Math.min(0.95,pitch)));
  }
  return pitches;
}

function buildPitchSVG(words, pitches, liaisons){
  const n=words.length;
  const W=340;
  // 단어 수에 따라 동적으로 높이 결정
  const labelRows=Math.ceil(n/6);
  const H=110+labelRows*4;
  const padL=10, padR=10, padT=14, padB=38;
  const innerW=W-padL-padR;
  const innerH=H-padT-padB;
  const colW=innerW/n;

  const xs=words.map((_,i)=>padL+colW*i+colW/2);
  const ys=pitches.map(p=>padT+innerH*(1-p));

  // ── 부드러운 곡선 (Catmull-Rom → Bezier 변환) ──
  function catmullToBezier(pts){
    if(pts.length<2) return `M ${pts[0][0]},${pts[0][1]}`;
    let d=`M ${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[Math.max(0,i-1)];
      const p1=pts[i];
      const p2=pts[i+1];
      const p3=pts[Math.min(pts.length-1,i+2)];
      const cp1x=(p1[0]+(p2[0]-p0[0])/6).toFixed(2);
      const cp1y=(p1[1]+(p2[1]-p0[1])/6).toFixed(2);
      const cp2x=(p2[0]-(p3[0]-p1[0])/6).toFixed(2);
      const cp2y=(p2[1]-(p3[1]-p1[1])/6).toFixed(2);
      d+=` C ${cp1x},${cp1y} ${cp2x},${cp2y} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    return d;
  }

  const pts=xs.map((x,i)=>[x,ys[i]]);
  const curvePath=catmullToBezier(pts);

  // 채우기용 하단 path
  const fillPath=curvePath+` L ${xs[n-1].toFixed(2)},${(padT+innerH).toFixed(2)} L ${xs[0].toFixed(2)},${(padT+innerH).toFixed(2)} Z`;

  // 단어별 억양 레이블 (H / M / L)
  const accentLabels=pitches.map((p,i)=>{
    const label=p>=0.72?'H':p>=0.42?'M':'L';
    const color=p>=0.72?'#5aaad4':p>=0.42?'#90b8c8':'#b0b0b0';
    const x=xs[i];
    const y=ys[i]-7;
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="8" font-weight="600" fill="${color}" opacity="0.85">${label}</text>`;
  }).join('');

  // 점
  const dots=xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="#5aaad4" stroke="rgba(255,255,255,.7)" stroke-width="1" opacity="0.95"/>`).join('');

  // 단어 라벨
  const labels=words.map((w,i)=>{
    const x=xs[i];
    const y=H-6;
    return `<text x="${x.toFixed(1)}" y="${y}" text-anchor="middle" font-size="9.5" fill="#5a7584" font-family="inherit">${esc(w)}</text>`;
  }).join('');

  // 연음 마크 (⌢ 호 모양)
  const liaisonMarks=liaisons.map((has,i)=>{
    if(!has||i>=n-1) return '';
    const x1=xs[i], x2=xs[i+1];
    const mx=(x1+x2)/2;
    const my=H-padB+16; // 단어 라벨 아래쪽
    const rx=(x2-x1)*0.38;
    return `<path d="M ${(mx-rx).toFixed(1)},${my} Q ${mx.toFixed(1)},${(my-7).toFixed(1)} ${(mx+rx).toFixed(1)},${my}" fill="none" stroke="#d870a8" stroke-width="1.5" opacity="0.75"/>
    <text x="${mx.toFixed(1)}" y="${(my-9).toFixed(1)}" text-anchor="middle" font-size="7" fill="#d870a8" opacity="0.75">연음</text>`;
  }).join('');

  // 배경 가이드
  const guides=['H','M','L'].map((lbl,idx)=>{
    const levels=[0.75,0.45,0.18];
    const gy=padT+innerH*(1-levels[idx]);
    return `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="rgba(90,170,212,.10)" stroke-width="1" stroke-dasharray="3,4"/>
    <text x="${(padL-2).toFixed(1)}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="7.5" fill="rgba(90,170,212,.45)">${lbl}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    ${guides}
    <path d="${fillPath}" fill="rgba(90,170,212,.07)"/>
    <path d="${curvePath}" fill="none" stroke="#5aaad4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    ${accentLabels}
    ${dots}
    ${labels}
    ${liaisonMarks}
  </svg>`;
}

function esc(str){return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function esc2(str){return String(str).replace(/'/g,"\\'")}

function renderVList(){
  const srchEl=document.getElementById('srchIn');
  const keyword=(searchOpenTab==='vlist'?srchEl?.value||'':'').toLowerCase().trim();
  let arr=PL.map((v,i)=>({...v,i})).filter(v=>v.title.toLowerCase().includes(keyword));
  arr.sort(vSort==='oldest'?(a,b)=>a.dv-b.dv:(a,b)=>b.dv-a.dv);
  document.getElementById('vlist').innerHTML=arr.map(v=>`
    <div class="vitem" onclick="openDetail(${v.i})">
      <div class="vthumb"><img src="https://i.ytimg.com/vi/${v.videoId}/maxresdefault.jpg" alt="" onerror="this.style.background='#222'"></div>
      <div class="vinfo">
        <div class="vtitle">${v.title}</div>
        <div class="vmeta">NCT WISH · ${v.date}</div>
        <div class="vbrow"><span class="vcnt">${v.sentences.length}개 문장</span></div>
      </div>
    </div>`).join('');
}

function setVSort(btn){
  document.querySelectorAll('[data-vs]').forEach(b=>b.classList.remove('on'));

function renderTranscript(vi){
  const v=PL[vi];
  document.getElementById('d-title').textContent=v.title;
  document.getElementById('d-sub').textContent='NCT WISH · '+v.date;
  document.getElementById('transcript').innerHTML=v.sentences.map(s=>{
    const mm=Math.floor(s.start/60),ss2=String(s.start%60).padStart(2,'0');
    const cpid='rcp-'+s.id;
    return `<div class="srow" id="row-${s.id}" data-speaker="${s.speaker}">
      <div class="sl">
        <button class="tbtn" onclick="seekTo(${s.start})">${mm}:${ss2}</button>
        <button class="sspk" style="background:${MEM[s.speaker]||'#999'}" onclick="filterSpk('${s.speaker}');event.stopPropagation()">${s.speaker}</button>
      </div>
      <button class="srow-main" onclick="seekTo(${s.start})">
        <div class="sr">
          <span class="sr-jp">${addCwHandlers(s.jp)}</span>
          <span class="sr-sound">${s.sound}</span>
          <span class="sr-trans">${s.trans}</span>
        </div>
      </button>
      <div class="srow-rep">
        <button class="rrep" id="rr-${s.id}" onclick="togRowRep(${s.id},${s.start},${s.end},this)">
          <span class="material-symbols-rounded">repeat</span>

        <button class="rcopy" id="${cpid}" onclick="copyJP(event,'${esc2(s.plain)}','${cpid}')">

        </button>

}

function togChip(btn){
  const f=btn.dataset.f, v=btn.dataset.v;
  if(AF[f].has(v)){AF[f].delete(v);btn.classList.remove('on');}
  else{AF[f].add(v);btn.classList.add('on');}

function applyFilters(){
  const raw=(document.getElementById('srchIn').value||'').trim().toLowerCase();

  const filtered=ALL.filter(s=>{
    const mOk=AF.member.size===0||AF.member.has(s.speaker);
    const jOk=AF.jlpt.size===0||((s.jlpt||'')!==''&&AF.jlpt.has(s.jlpt));
    const sk=(s.sk+' '+s.sound+' '+s.trans+' '+s.plain).toLowerCase();
    const sOk=!raw||sk.includes(raw);
    return mOk&&jOk&&sOk;
  });

  const slist=document.getElementById('slist');
  slist.innerHTML=filtered.map(s=>`
    <div class="sitem">
      <div class="sitem-head">
        <span class="spkpill" style="background:${MEM[s.speaker]||'#999'}">${s.speaker}</span>
        <button class="vlink" onclick="openDetailAt(${s.vi},${s.start},${s.id});event.stopPropagation()">
          ${PL[s.vi].title}
        </button>
        <span class="jbadge">${s.jlpt}</span>
      </div>
      <div class="sitem-body">${sentBox(s,'all'+s.id)}</div>
    </div>`).join('');

  const em=document.getElementById('empty-msg');
  if(em) em.style.display=filtered.length===0?'block':'none';
}

function toggleSearch(){
  const w=document.getElementById('srchWrap');
  const inp=document.getElementById('srchIn');
  const isVlist=document.getElementById('view-vlist').style.display==='flex';
  const currentTab=isVlist?'vlist':'all';
  const isOpen=searchOpenTab===currentTab;
  if(isOpen){
    searchOpenTab=null;w.style.display='none';inp.value='';
    if(isVlist)renderVList();else applyFilters();
  } else {
    searchOpenTab=currentTab;w.style.display='block';
    inp.placeholder=isVlist?'영상 제목 검색':'단어, 발음, 뜻으로 검색';
    inp.value='';
    requestAnimationFrame(()=>inp.focus());
  }
}

function goDetail(){
  openDetailAt(todayS.vi, todayS.start, todayS.id);
  setTimeout(()=>{
    if(!detailP?.seekTo)return;
    detailP.seekTo(toSec(todayS.start),true);
    detailP.playVideo();
    const endSec=toSec(todayS.end);
    const checkEnd=setInterval(()=>{
      if(!detailP?.getCurrentTime)return;
      if(detailP.getCurrentTime()>=endSec){
        detailP.pauseVideo();
        clearInterval(checkEnd);
      }
    },100);
  }, 600);

function togRowRep(id,s,e,btn){
  if(!detailP?.seekTo)return;
  if(detailLoop&&dLoopId===id){
    detailLoop=false;dLoopId=null;clearInterval(detailTick);
    document.querySelectorAll('.rrep').forEach(b=>b.classList.remove('on'));
    const sents=PL[selVI].sentences;
    const curIdx=sents.findIndex(sent=>sent.id===id);
    const next=sents[curIdx+1];
    if(next){detailP.seekTo(toSec(next.start),true);detailP.playVideo();}
    else{detailP.seekTo(toSec(e),true);detailP.playVideo();}
    return;
  }
  stopDAll();
  detailLoop=true;dLoopId=id;btn.classList.add('on');
  detailP.seekTo(s,true);detailP.playVideo();
  clearInterval(detailTick);
  detailTick=setInterval(()=>{const c=detailP.getCurrentTime?.();if(c>=e||c<s-1)detailP.seekTo(s,true);},100);
}

function stopDAll(pause=false){
  detailLoop=false;dLoopId=null;clearInterval(detailTick);
  document.querySelectorAll('.rrep').forEach(b=>b.classList.remove('on'));
  if(pause)detailP?.pauseVideo();
}

function seekTo(sec){
  if(!detailP?.seekTo)return;
  stopDAll(true);detailP.seekTo(sec,true);detailP.playVideo();
}

function filterSpk(name){

// ── 스와이프 / 페이지 플립 ──

// 랜덤 문장 카드 스와이프 (책장 넘기기)
(function initCardSwipe(){
  const TABS=['today','all','vlist'];
  let swStartX=0, swStartY=0, swStartTab=null;
  let cardStartX=-999, cardStartY=0, cardSwiping=false, cardDir=0;
  let mouseDown=false;

  function getActiveTab(){
    return TABS.find(id=>document.getElementById('view-'+id)?.style.display==='flex')||'today';
  }
  function getRndHero(){return document.querySelector('#view-today .rnd-hero');}

  function onDragStart(cx, cy){
    swStartX=cx; swStartY=cy; swStartTab=getActiveTab();
    const hero=getRndHero();
    if(!hero){cardStartX=-999;return;}
    const r=hero.getBoundingClientRect();
    if(cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom){
      cardStartX=cx; cardStartY=cy; cardSwiping=false; cardDir=0;
    } else {cardStartX=-999;}
  }

  function onDragMove(cx, cy){
    if(cardStartX!==-999){
      const dx=cx-cardStartX, dy=cy-cardStartY;
      if(!cardSwiping&&(Math.abs(dx)>8||Math.abs(dy)>8)){
        cardSwiping=true;
        cardDir=Math.abs(dy)>=Math.abs(dx)?(dy>0?2:-2):(dx>0?1:-1);
      }
      if(cardSwiping&&Math.abs(cardDir)===2){
        const hero=getRndHero();
        if(hero) hero.style.transform=`translateY(${(cy-cardStartY)*0.38}px) scale(${1-Math.abs(cy-cardStartY)*0.0005})`;
      }
    }
  }

  function onDragEnd(cx, cy){
    const hero=getRndHero();
    const dx=cx-cardStartX, dy=cy-cardStartY;
    const wasSwiping=cardSwiping;
    const lastDir=cardDir;
    const savedCardStartX=cardStartX;
    cardSwiping=false; cardStartX=-999; cardDir=0;

    // ── 탭 스와이프 (카드 밖에서 가로) ──
    const detailOpen=document.getElementById('view-detail')?.style.display==='flex';
    if(!detailOpen){
      const ddx=cx-swStartX, ddy=cy-swStartY;
      const heroR=hero?.getBoundingClientRect();
      const onCard=heroR&&swStartY>=heroR.top&&swStartY<=heroR.bottom&&swStartX>=heroR.left&&swStartX<=heroR.right;
      if(!onCard&&Math.abs(ddx)>=Math.abs(ddy)*1.3&&Math.abs(ddx)>=52){
        const cur=TABS.indexOf(swStartTab);
        if(cur!==-1){
          if(ddx<0&&cur<TABS.length-1) changeTab(TABS[cur+1]);
          else if(ddx>0&&cur>0) changeTab(TABS[cur-1]);
          return;
        }
      }
    }

    if(!hero||savedCardStartX===-999) return;

    const isVert=Math.abs(lastDir)===2;
    const dist=isVert?Math.abs(dy):Math.abs(dx);

    if(!wasSwiping||!isVert||dist<50){
      hero.style.transition='transform .35s cubic-bezier(.22,1,.36,1)';
      hero.style.transform='';
      setTimeout(()=>hero.style.transition='',380);
      return;
    }

    // 위로 스와이프(dy<0) → 새 랜덤, 아래로 스와이프(dy>0) → 이전 문장
    const goBack=dy>0;
    const dir=goBack?1:-1; // 1=아래로 날아가기, -1=위로 날아가기
    hero.style.transition='transform .25s cubic-bezier(.55,.0,.85,.06), opacity .2s ease';
    hero.style.transform=`translateY(${dir*100}%) scale(0.88)`;
    hero.style.opacity='0';
    setTimeout(()=>{
      if(goBack) flipToPrevSent();
      else flipToNextSent();
      const nh=getRndHero(); if(!nh) return;
      nh.style.transition='none';
      nh.style.transform=`translateY(${-dir*70}%) scale(0.92)`;
      nh.style.opacity='0.2';
      setTimeout(()=>{
        nh.style.transition='transform .32s cubic-bezier(.22,1,.36,1), opacity .26s ease';
        nh.style.transform=''; nh.style.opacity='1';
        setTimeout(()=>nh.style.transition='',360);
      },30);
    },230);
  }

  // ── 터치 ──
  document.addEventListener('touchstart', e=>{
    onDragStart(e.touches[0].clientX, e.touches[0].clientY);
  },{passive:true});
  document.addEventListener('touchmove', e=>{
    onDragMove(e.touches[0].clientX, e.touches[0].clientY);
  },{passive:true});
  document.addEventListener('touchend', e=>{
    onDragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  },{passive:true});

  // ── 마우스 (웹 데스크톱) ──
  document.addEventListener('mousedown', e=>{
    if(e.target.closest('button,a,input,select,textarea')) return;
    mouseDown=true;
    onDragStart(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', e=>{
    if(!mouseDown) return;
    onDragMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', e=>{
    if(!mouseDown) return;
    mouseDown=false;
    onDragEnd(e.clientX, e.clientY);
  });
  document.addEventListener('mouseleave', ()=>{
    if(!mouseDown) return;
    mouseDown=false;
    const hero=getRndHero();
    if(hero){
      hero.style.transition='transform .35s cubic-bezier(.22,1,.36,1)';
      hero.style.transform='';
      setTimeout(()=>hero.style.transition='',380);
    }
    cardStartX=-999; cardSwiping=false; cardDir=0;
  });
})();

// ── 랜덤 문장 히스토리 ──
const sentHistory=[];
let sentHistoryIdx=-1;

function flipToNextSent(){
  // 히스토리 앞에 더 있으면 앞으로 이동, 없으면 새 랜덤
  if(sentHistoryIdx < sentHistory.length-1){
    sentHistoryIdx++;
    todayS=sentHistory[sentHistoryIdx];
  } else {
    const cur=todayS;
    let next;
    do { next=ALL[Math.floor(Math.random()*ALL.length)]; } while(next.id===cur.id&&ALL.length>1);
    sentHistory.splice(sentHistoryIdx+1); // 앞 히스토리 제거
    sentHistory.push(next);
    if(sentHistory.length>30) sentHistory.shift(); // 최대 30개
    sentHistoryIdx=sentHistory.length-1;
    todayS=next;
  }
  selVI=todayS.vi;
  renderRandom();
}

function flipToPrevSent(){
  if(sentHistoryIdx<=0) return; // 이전 없으면 무시
  sentHistoryIdx--;
  todayS=sentHistory[sentHistoryIdx];
  selVI=todayS.vi;
  renderRandom();
}

function flipToRandomSent(){ flipToNextSent(); }

function handleBack(){
  stopActiveSentTracking();
  closeTooltip(false);
  changeTab(prevTab);
  localStorage.setItem('currentTab',prevTab);
}

function changeTab(tab){
  closeTooltip(false);
  ['today','all','vlist'].forEach(id=>document.getElementById('view-'+id)?.style.setProperty('display','none'));
  document.getElementById('view-detail').style.display='none';
  ['today','all','vlist'].forEach(id=>document.getElementById('tab-'+id)?.classList.remove('on'));
  document.getElementById('btnBack').style.visibility='hidden';
  document.getElementById('btnSearch').style.display='none';
  const w=document.getElementById('srchWrap');
  const inp=document.getElementById('srchIn');
  if(searchOpenTab&&searchOpenTab!==tab){
    searchOpenTab=null;w.style.display='none';inp.value='';
    applyFilters();renderVList();
  }
  if(detailLoop){stopDAll(true);}
  clearDFilter();stopActiveSentTracking();
  if(['today','all','vlist'].includes(tab)){
    document.getElementById('view-'+tab).style.display='flex';
    document.getElementById('tab-'+tab)?.classList.add('on');
  }
  if(tab==='all')document.getElementById('btnSearch').style.display='flex';
  if(tab==='vlist')document.getElementById('btnSearch').style.display='flex';
  if(tab!=='detail')localStorage.setItem('currentTab',tab);
}

function openDetail(vi){openDetailAt(vi,null,null)}

function openDetailAt(vi,seekSec,sentId){
  const cur=['today','all','vlist'].find(id=>{const el=document.getElementById('view-'+id);return el&&el.style.display==='flex';});
  if(cur)prevTab=cur;
  const changed=vi!==undefined&&selVI!==vi;
  if(changed){
    selVI=vi;renderTranscript(vi);stopActiveSentTracking();
    if(detailP&&typeof detailP.loadVideoById==='function'){
      detailP.loadVideoById({videoId:PL[vi].videoId,startSeconds:seekSec??0});
    }
  }
  clearDFilter();
  ['today','all','vlist'].forEach(id=>{document.getElementById('view-'+id)?.style.setProperty('display','none');document.getElementById('tab-'+id)?.classList.remove('on');});
  document.getElementById('view-detail').style.display='flex';
  document.getElementById('btnBack').style.visibility='visible';
  document.getElementById('btnSearch').style.display='none';
  if(searchOpenTab){searchOpenTab=null;document.getElementById('srchWrap').style.display='none';document.getElementById('srchIn').value='';}
  if(seekSec!=null&&!changed)setTimeout(()=>seekTo(seekSec),200);
  if(sentId!=null)setTimeout(()=>scrollToRow(sentId),400);
  localStorage.setItem('currentTab','detail');
  localStorage.setItem('selectedVI',vi);
}

function copyJP(e,text,id){
  e.stopPropagation();
  navigator.clipboard.writeText(text).then(()=>{
    const b=document.getElementById(id);if(!b)return;
    b.classList.add('done');
    b.innerHTML='<span class="material-symbols-rounded">check</span>';
    setTimeout(()=>{b.classList.remove('done');b.innerHTML='<span class="material-symbols-rounded">content_copy</span>';},1400);
  });
}

let playbackRate=1;
function restartTranscript(){
  if(!detailP?.seekTo)return;
  const sents=PL[selVI].sentences;
  if(!sents||!sents.length)return;
  stopDAll(true);detailP.seekTo(toSec(sents[0].start),true);detailP.playVideo();
}

function changeSpeed(diff){
  playbackRate+=diff;
  if(playbackRate<0.25)playbackRate=0.25;
  if(playbackRate>3)playbackRate=3;
  playbackRate=Math.round(playbackRate*100)/100;
  if(detailP&&typeof detailP.setPlaybackRate==='function')detailP.setPlaybackRate(playbackRate);
  document.getElementById('speedLabel').textContent=playbackRate.toFixed(2)+'x';
}</script>
